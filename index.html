    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This site can’t be reached</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Страница ошибки (Фейк) -->
    <div class="error-container">
        <!-- Исправлен ID на secret-trigger -->
        <div class="icon-wrapper" id="secret-trigger" style="cursor: pointer;">
            <svg class="error-icon" viewBox="0 0 24 24" fill="#9aa0a6">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        <h1 class="error-title">This site can’t be reached</h1>
        <p class="error-text">Check if there is a typo in <span class="domain-highlight">ukraina.ru</span>.</p>
        <p class="error-subtext">If spelling is correct, try running Windows Network Diagnostics.</p>
        <p class="error-code">DNS_PROBE_FINISHED_NXDOMAIN</p>
        <button class="reload-btn" onclick="location.reload()">Reload</button>
    </div>

    <!-- Модальное окно PIN-кода -->
    <div class="modal-overlay" id="pin-modal">
        <div class="modal-box">
            <h3>Вход в систему</h3>
            <p>Введите PIN-код доступа:</p>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••">
            <!-- Исправлен ID на pin-error-msg -->
            <div class="pin-error" id="pin-error-msg">Неверный PIN-код!</div>
            <div class="modal-buttons" style="margin-top: 15px;">
                <!-- Исправлены ID на pin-submit-btn и pin-cancel-btn -->
                <button id="pin-submit-btn">Войти</button>
                <button class="btn-cancel" id="pin-cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
